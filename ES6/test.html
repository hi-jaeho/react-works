<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM(문서 객체 모델) 예제</title>
</head>
<body>
    <h2>실습</h2>
    <p id="demo"></p>
    <script>
        alert("니가 뭘 알럿!");
        const demo = document.getElementById("demo");
        demo.innerText = "";
        demo.style.color = "red";
        demo.style.backgroundColor = "pink";
        demo.style.fontSize = "30px";
    </script>
</body>
</html>
